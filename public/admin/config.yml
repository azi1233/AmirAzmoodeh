# Decap CMS configuration — https://decapcms.org/docs/
#
# Behind "Login with GitHub" this site uses Netlify's free OAuth proxy
# (https://api.netlify.com). The site itself stays on GitHub Pages — only the
# OAuth handshake goes through Netlify.
#
# MANUAL SETUP (completed for this site — kept as a record):
#   1. GitHub OAuth App   — Settings → Developer settings → OAuth Apps → New
#      OAuth App. Authorization callback URL MUST be:
#          https://api.netlify.com/auth/done
#      Copy the Client ID and generate a Client Secret afterwards.
#   2. Netlify site (used only as the auth relay) — app.netlify.com → Add new
#      site (any blank site). Set a Site name, e.g. "amirmoodeh-cms-auth".
#      Then: Site configuration → Access & security → OAuth → Install provider
#      → GitHub → paste the Client ID + Client Secret.
#   3. Copy that site's "Project ID" (site settings, labelled Site ID in the
#      API) and paste it below in `site_domain`.
#
# ⚠ THE KEY IS `site_domain`, NOT `site_id` — this is a trap.
#   Decap's login page reads only `backend.site_domain`. The shipped
#   decap-cms.js contains ZERO references to `backend.site_id`, so a `site_id:`
#   key is silently ignored. Its helper then falls back to the browser's own
#   hostname, producing this request:
#       https://api.netlify.com/auth?provider=github
#         &site_id=azi1233.github.io&scope=repo
#   which Netlify rejects with a bare "Not Found". The misleading part: the
#   `site_domain` NAME takes a Netlify Project ID (a UUID) as its VALUE — the
#   name is a leftover in Decap's code, not a hint about the format.

backend:
  name: github
  repo: azi1233/AmirAzmoodeh
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  site_domain: "66b4f6f7-4875-4815-bfa3-3242fa5b39f9"

# Editorial workflow is intentionally OFF. With the "github" backend it would
# funnel every post through a GitHub branch + pull request (saving creates a PR,
# publishing merges it). For a single-author site that already uses the
# frontmatter `draft` field to keep unpublished posts out of production, that
# extra review loop only adds friction on a phone. Direct commits = hit save,
# your existing GitHub Actions workflow builds and deploys. If you later want a
# review step for co-authors, add this line at the top level:
#   publish_mode: editorial_workflow

site_url: https://azi1233.github.io/AmirAzmoodeh/
display_url: https://azi1233.github.io/AmirAzmoodeh/
locale: en

# Uploads land in public/images/ and are referenced as /images/... from posts.
# The markdown body is rewritten to use the base path automatically at build
# time by the template's rehype-base-path plugin.
media_folder: public/images
public_folder: /images

collections:
  - name: "post"
    label: "Posts"
    label_singular: "Post"
    folder: "src/content/post"
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{publishDate}}"
    sortable_fields: [publishDate, title]
    view_groups:
      - label: "Year"
        field: publishDate
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - label: "Publish Date"
        name: "publishDate"
        widget: "datetime"
        required: true
      - label: "Updated Date"
        name: "updatedDate"
        widget: "datetime"
        required: false
      - label: "Description"
        name: "description"
        widget: "text"
        required: true
        hint: "One-sentence summary used in cards and meta tags (10–160 characters)."
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        default: []
      - label: "Draft (hidden from production)"
        name: "draft"
        widget: "boolean"
        required: false
        default: false
      # NOTE: coverImage itself is optional, so its inner fields must NOT be
      # `required: true`. Decap validates the inner fields even when the whole
      # object is absent, which makes every save fail with
      # "Image is required. / Alt text are required." for posts that have no
      # cover image. The "required" here only means: fill these in *if* you add
      # a cover image at all.
      - label: "Cover Image"
        name: "coverImage"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Image", name: "src", widget: "image", required: false, choose_url: false }
          - { label: "Alt text", name: "alt", widget: "string", required: false }
      - label: "OG Image (optional override)"
        name: "ogImage"
        widget: "image"
        required: false
        choose_url: true
      - { label: "Body", name: "body", widget: "markdown" }
