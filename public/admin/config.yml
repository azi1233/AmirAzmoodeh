# Decap CMS configuration — https://decapcms.org/docs/
#
# Login uses Decap Turbo ("Login with Turbo"). The Turbo site dashboard holds
# the GitHub repository/branch connection; `turbo_site_id` below is the only
# hand-set auth value. There is no Netlify OAuth proxy and no GitHub OAuth app
# involved in this flow, so no Netlify-specific keys belong in this block.
# Docs: https://decapcms.org/docs/turbo-connecting-a-site/
#
# NOTE: `repo` is intentionally absent here. For turbo-github the repository on
# the Turbo site row is authoritative and any local `repo` value is ignored,
# so a stale copy here would only mislead (it is what produces
# "requested repo does not match"). Change the repo in the Turbo dashboard.
# `branch`, if set, overrides the site row; otherwise the site row wins.

backend:
  name: turbo-github
  turbo_site_id: "b77473e7-6386-4683-8277-5755b3856334"
  branch: main

# Editorial workflow is intentionally OFF. With the "github" backend it would
# funnel every post through a GitHub branch + pull request (saving creates a PR,
# publishing merges it). For a single-author site that already uses the
# frontmatter `draft` field to keep unpublished posts out of production, that
# extra review loop only adds friction on a phone. Direct commits = hit save,
# your existing GitHub Actions workflow builds and deploys. If you later want a
# review step for co-authors, add this line at the top level:
#   publish_mode: editorial_workflow

site_url: https://azi1233.github.io/AmirAzmoodeh/
display_url: https://azi1233.github.io/AmirAzmoodeh/
locale: en

# Uploads land in public/images/ and are referenced as /images/... from posts.
# The markdown body is rewritten to use the base path automatically at build
# time by the template's rehype-base-path plugin.
media_folder: public/images
public_folder: /images

collections:
  - name: "post"
    label: "Posts"
    label_singular: "Post"
    folder: "src/content/post"
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{publishDate}}"
    sortable_fields: [publishDate, title]
    view_groups:
      - label: "Year"
        field: publishDate
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - label: "Publish Date"
        name: "publishDate"
        widget: "datetime"
        required: true
      - label: "Updated Date"
        name: "updatedDate"
        widget: "datetime"
        required: false
      - label: "Description"
        name: "description"
        widget: "text"
        required: true
        hint: "One-sentence summary used in cards and meta tags (10–160 characters)."
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        default: []
      - label: "Draft (hidden from production)"
        name: "draft"
        widget: "boolean"
        required: false
        default: false
      # NOTE: coverImage itself is optional, so its inner fields must NOT be
      # `required: true`. Decap validates the inner fields even when the whole
      # object is absent, which makes every save fail with
      # "Image is required. / Alt text are required." for posts that have no
      # cover image. The "required" here only means: fill these in *if* you add
      # a cover image at all.
      - label: "Cover Image"
        name: "coverImage"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Image", name: "src", widget: "image", required: false, choose_url: false }
          - { label: "Alt text", name: "alt", widget: "string", required: false }
      - label: "OG Image (optional override)"
        name: "ogImage"
        widget: "image"
        required: false
        choose_url: true
      - { label: "Body", name: "body", widget: "markdown" }
